<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lucas Lamounier monogram">
  <style>
    .bg { fill: #151618; }
    .fg { fill: #F7F6F2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #F7F6F2; }
      .fg { fill: #151618; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="10"/>
  <text class="fg" x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="500" letter-spacing="-1">LL</text>
</svg>
